<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic: plan cards with one asterisk footnote each (Ridgeline Mobile, fictional)</title></head>
<body style="font-size: 16px">
  <main class="plans">
    <div class="card">
      <h2>Essentials</h2>
      <div class="price"><span>$30</span><span>/mo</span>*</div>
      <p class="card-note" style="font-size: 11px">*Per line with 4 lines and autopay. Video streams at 480p.</p>
    </div>
    <div class="card">
      <h2>Plus</h2>
      <div class="price"><span>$45</span><span>/mo</span>*</div>
      <p class="card-note" style="font-size: 11px">*Per line with 3 lines and autopay. Slower speeds after 50GB.</p>
    </div>
    <div class="card">
      <h2>Max</h2>
      <div class="price"><span>$60</span><span>/mo</span>*</div>
      <p class="card-note" style="font-size: 11px">*Single line with autopay. 50GB mobile hotspot. $35 activation fee.</p>
    </div>
  </main>
</body>
</html>
