name: Bug report
description: Catchline matched the wrong footnote, missed a marker, or the UI misbehaved.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste a copy of a company's page. If the problem is a
        matching mistake, a short fictional page that shows the same markup pattern is ideal.
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - Wrong footnote matched
        - Marker not found
        - Something that is not a footnote was marked
        - A chip is missing or wrong
        - Card, Show all or popup looks or behaves wrong
        - Something else
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: The claim and the footnote
      description: The claim text with its marker, the footnote it should match, and what Catchline showed.
      placeholder: |
        Claim: "$0/mo*"
        Expected footnote: "*With 36-month installment agreement..."
        Catchline showed: "No footnote found"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Fictional page or steps to reproduce
      description: Paste minimal HTML (invented company, `.example` links) or the steps.
      render: html
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 142 on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Catchline version
      placeholder: 0.1.0
